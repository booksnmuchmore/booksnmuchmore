<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>You're Offline — Books 'n' Much More</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Lora:ital,wght@0,400;0,500&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --ink:#2C1A0E;
    --cream:#FBF6EC;
    --parchment:#F5ECD7;
    --amber:#C8813A;
    --sienna:#8B4010;
    --gold:#D4A84B;
    --muted:#7A6250;
  }
  html,body{height:100%;}
  body{
    background:var(--cream);color:var(--ink);font-family:'Lora',Georgia,serif;
    display:flex;align-items:center;justify-content:center;padding:6%;text-align:center;
  }
  .card{max-width:440px;}
  .icon{
    width:88px;height:88px;border-radius:50%;background:var(--parchment);
    display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;
    box-shadow:0 4px 20px rgba(44,26,14,0.13);
  }
  .icon svg{width:40px;height:40px;stroke:var(--sienna);}
  h1{font-family:'Playfair Display',serif;font-weight:800;font-size:1.6rem;margin-bottom:0.75rem;}
  p{color:var(--muted);font-size:0.98rem;line-height:1.6;margin-bottom:2rem;}
  .btn{
    display:inline-flex;align-items:center;gap:0.5rem;font-family:'Raleway',sans-serif;
    font-size:0.75rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
    color:#fff;background:var(--amber);padding:0.75rem 1.6rem;border-radius:3px;
    text-decoration:none;border:none;cursor:pointer;transition:background 0.2s;
  }
  .btn:hover{background:var(--sienna);}
  .hint{margin-top:1.25rem;font-family:'Raleway',sans-serif;font-size:0.72rem;color:var(--muted);letter-spacing:0.02em;}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
    </div>
    <h1>Looks like you're offline</h1>
    <p>No connection right now — but any lessons you've already opened are still saved. Reconnect to keep reading, or try again.</p>
    <button class="btn" onclick="location.reload()">Try Again</button>
    <p class="hint">One Lesson Can Change Your Life — even offline, what you've read stays with you.</p>
  </div>
</body>
</html>
