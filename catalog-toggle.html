<!--
  Books 'n' Much More — Compact Catalog Component
  ------------------------------------------------
  Drop this section into your catalog page (replacing or alongside the
  existing catalog markup). It fetches books from the same Supabase RPC
  you already use (get_all_live_books) and renders two views:
    - Grid view (default): cover + title + author, no long scroll
    - List view: cover thumbnail + title + author + category tag

  Requirements assumed from your existing setup:
    - Supabase client is available as BNMAuth.supabase (per your convention)
    - get_all_live_books() RPC returns rows with at least:
        title, author, slug, cover_url (or similar), category / tag
      Adjust the field names in renderBook() below to match your actual
      column names if they differ.
-->

<section id="bnm-catalog" aria-label="Book catalog">

  <div class="bnm-catalog-toolbar">
    <button id="bnm-view-grid" class="bnm-toggle-btn active" aria-pressed="true">Grid view</button>
    <button id="bnm-view-list" class="bnm-toggle-btn" aria-pressed="false">List view</button>
  </div>

  <div id="bnm-catalog-status" class="bnm-catalog-status" role="status">Loading books…</div>

  <div id="bnm-grid-view" class="bnm-grid"></div>
  <div id="bnm-list-view" class="bnm-list" style="display:none;"></div>

</section>

<style>
  #bnm-catalog { max-width: 960px; margin: 0 auto; padding: 1rem; }

  .bnm-catalog-toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 1rem;
  }
  .bnm-toggle-btn {
    flex: 1;
    padding: 8px 12px;
    font-size: 14px;
    font-weight: 500;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
  }
  .bnm-toggle-btn.active {
    background: #222;
    color: #fff;
    border-color: #222;
  }

  .bnm-catalog-status {
    font-size: 13px;
    color: #888;
    text-align: center;
    margin-bottom: 8px;
  }
  .bnm-catalog-status.hidden { display: none; }

  /* GRID VIEW
     84px min column keeps 3 columns on a ~375px mobile screen
     without any extra media queries. */
  .bnm-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
    gap: 12px;
  }
  .bnm-grid-item {
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .bnm-grid-cover {
    width: 100%;
    aspect-ratio: 2 / 3;
    border-radius: 6px;
    background-size: cover;
    background-position: center;
    background-color: #eee;
    margin-bottom: 4px;
  }
  .bnm-grid-title {
    font-size: 12px;
    font-weight: 500;
    line-height: 1.3;
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .bnm-grid-author {
    font-size: 11px;
    color: #888;
    margin: 2px 0 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* LIST VIEW */
  .bnm-list {
    border: 1px solid #eee;
    border-radius: 12px;
    overflow: hidden;
  }
  .bnm-list-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-bottom: 1px solid #eee;
    text-decoration: none;
    color: inherit;
    min-height: 44px; /* touch target */
  }
  .bnm-list-row:last-child { border-bottom: none; }
  .bnm-list-cover {
    width: 28px;
    height: 40px;
    border-radius: 4px;
    flex-shrink: 0;
    background-size: cover;
    background-position: center;
    background-color: #eee;
  }
  .bnm-list-text { flex: 1; min-width: 0; }
  .bnm-list-title {
    font-size: 14px;
    font-weight: 500;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bnm-list-author {
    font-size: 12px;
    color: #888;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bnm-list-tag {
    font-size: 11px;
    color: #aaa;
    flex-shrink: 0;
    max-width: 90px;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Small-screen safety net: below 340px, hide list-view tag rather
     than let it crowd the title/author. */
  @media (max-width: 340px) {
    .bnm-list-tag { display: none; }
  }
</style>

<script>
(async function () {
  const statusEl = document.getElementById('bnm-catalog-status');
  const gridEl = document.getElementById('bnm-grid-view');
  const listEl = document.getElementById('bnm-list-view');
  const btnGrid = document.getElementById('bnm-view-grid');
  const btnList = document.getElementById('bnm-view-list');

  function renderBook(book) {
    // Adjust these field names to match your actual RPC column names.
    const title = book.title || 'Untitled';
    const author = book.author || '';
    const slug = book.slug || '';
    const cover = book.cover_url || book.cover || '';
    const tag = book.genre || '';
    const href = slug ? `/books/${slug}.html` : '#';

    return { title, author, cover, tag, href };
  }

  function buildGridItem(b) {
    const a = document.createElement('a');
    a.className = 'bnm-grid-item';
    a.href = b.href;
    a.innerHTML = `
      <div class="bnm-grid-cover" style="background-image:url('${b.cover}')"></div>
      <p class="bnm-grid-title">${b.title}</p>
      <p class="bnm-grid-author">${b.author}</p>
    `;
    return a;
  }

  function buildListRow(b) {
    const a = document.createElement('a');
    a.className = 'bnm-list-row';
    a.href = b.href;
    a.innerHTML = `
      <div class="bnm-list-cover" style="background-image:url('${b.cover}')"></div>
      <div class="bnm-list-text">
        <p class="bnm-list-title">${b.title}</p>
        <p class="bnm-list-author">${b.author}</p>
      </div>
      <span class="bnm-list-tag">${b.tag}</span>
    `;
    return a;
  }

  function setView(view) {
    const isGrid = view === 'grid';
    gridEl.style.display = isGrid ? 'grid' : 'none';
    listEl.style.display = isGrid ? 'none' : 'block';
    btnGrid.classList.toggle('active', isGrid);
    btnList.classList.toggle('active', !isGrid);
    btnGrid.setAttribute('aria-pressed', String(isGrid));
    btnList.setAttribute('aria-pressed', String(!isGrid));
    try { localStorage.setItem('bnm_catalog_view', view); } catch (e) {}
  }

  btnGrid.addEventListener('click', () => setView('grid'));
  btnList.addEventListener('click', () => setView('list'));

  try {
    const { data, error } = await BNMAuth.supabase.rpc('get_all_live_books');
    if (error) throw error;

    const books = (data || []).map(renderBook);

    books.forEach(b => {
      gridEl.appendChild(buildGridItem(b));
      listEl.appendChild(buildListRow(b));
    });

    statusEl.classList.add('hidden');

    // Restore last-used view, default to grid.
    let savedView = 'grid';
    try { savedView = localStorage.getItem('bnm_catalog_view') || 'grid'; } catch (e) {}
    setView(savedView);

  } catch (err) {
    console.error('Failed to load catalog:', err);
    statusEl.textContent = 'Could not load books right now. Please refresh.';
  }
})();
</script>

<p style="max-width:960px; margin:1.5rem auto 0; padding:0 1rem; font-size:11px; color:#aaa; text-align:center;">
  This site contains summaries and personal takeaways. All book titles and content belong to their respective authors and publishers.
</p>
